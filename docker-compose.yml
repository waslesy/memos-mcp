services:
  memos:
    image: neosmemo/memos:stable
    container_name: memos
    volumes:
      - ./data:/var/opt/memos
    ports:
      - "5230:5230"
    restart: unless-stopped

  memos-mcp:
    build: .
    container_name: memos-mcp
    environment:
      - MEMOS_HOST=http://memos:5230
      - MEMOS_TOKEN=${MEMOS_TOKEN}
      - PORT=8080
    ports:
      - "8080:8080"
    depends_on:
      - memos
    restart: unless-stopped